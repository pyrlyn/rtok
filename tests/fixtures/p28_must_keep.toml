[[body]]
id = "design-note-prose"
family = "prose"
text = '''
# Settlement retries: decision record

Status: accepted. Owners: the ledger team.

## Context

Strict mode used to give up on the first failed leg, which left batches half settled whenever
the database restarted. Operations asked for bounded retries with jitter instead of an
unbounded loop, because the January incident showed a retry storm taking down the pool.

## Decision

1. Each batch gets one `RetryBudget` of 5 attempts per leg, shared by every worker.
2. The delay doubles from 200 ms and is capped at `MAX_BACKOFF_MS` = 30000, plus 12.5 percent jitter.
3. When the budget is spent the leg is reported as `BudgetExhausted`; the batch is never retried
   automatically a second time, an operator runs `acme settle --retry bat_01HZX4M8Q2`.
4. Readiness stays red until the pool reconnects, so the supervisor restarts the worker rather
   than letting it serve while degraded.

## Consequences

- p99 settlement latency rises from 248 ms to about 3.4 s only when the database is down.
- The audit chain gets one entry per leg, so `AuditChain::verify_all` cost grows linearly with legs.
- Supported on `acme-ledger` v0.14.1 and newer; v0.13.x keeps the old behaviour behind the
  `legacy-strict` feature, which will be removed in v0.16.0.

## Rejected alternatives

- A circuit breaker per account: too much state for the gain, see the benchmark in `bench/retry.md`.
- Queue every failed leg for a nightly job: breaks the 15 minute settlement promise to customers.

## How to verify

Run `cargo nextest run -p acme-ledger settle::` and then `acme verify --audit ledger.chain`;
both must exit 0. If the second command prints "audit chain broken at entry", stop and escalate.
'''
keep = [
  { kind = "identifier", text = "`RetryBudget` of 5 attempts per leg" },
  { kind = "number", text = "`MAX_BACKOFF_MS` = 30000" },
  { kind = "command", text = "acme settle --retry bat_01HZX4M8Q2" },
  { kind = "number", text = "from 248 ms to about 3.4 s" },
  { kind = "identifier", text = "`legacy-strict` feature, which will be removed in v0.16.0" },
  { kind = "path", text = "bench/retry.md" },
  { kind = "command", text = "cargo nextest run -p acme-ledger settle::" },
  { kind = "error", text = "audit chain broken at entry" },
]
