id = "git-diff-hunks"
family = "diff"
text = '''
diff --git a/crates/ledger/src/retry.rs b/crates/ledger/src/retry.rs
index 3b9c1f2..a47d0e8 100644
--- a/crates/ledger/src/retry.rs
+++ b/crates/ledger/src/retry.rs
@@ -12,9 +12,11 @@ use std::time::Duration;

 /// Upper bound for one backoff step. Longer waits hide a dead peer.
-const MAX_BACKOFF_MS: u64 = 10_000;
+const MAX_BACKOFF_MS: u64 = 30_000;
+const JITTER_PERMILLE: u64 = 125;

 pub struct RetryBudget {
     spent: u32,
     limit: u32,
+    window: Duration,
 }

@@ -48,14 +50,22 @@ impl RetryBudget {
     pub fn new(limit: u32) -> Self {
-        Self { spent: 0, limit }
+        Self { spent: 0, limit, window: Duration::from_secs(60) }
     }

-    pub fn spend(&mut self) -> bool {
-        if self.spent >= self.limit {
-            return false;
-        }
-        self.spent += 1;
-        true
+    /// Returns the delay before the next attempt, or `None` when the budget is gone.
+    pub fn spend(&mut self, attempt: u32) -> Option<Duration> {
+        if self.spent >= self.limit {
+            return None;
+        }
+        self.spent += 1;
+        let base = 200u64.saturating_mul(1 << attempt.min(10));
+        let capped = base.min(MAX_BACKOFF_MS);
+        let jitter = capped * JITTER_PERMILLE / 1000;
+        Some(Duration::from_millis(capped + jitter))
     }

@@ -91,6 +101,7 @@ impl RetryBudget {
     pub fn reset(&mut self) {
         self.spent = 0;
+        self.window = Duration::from_secs(60);
     }
 }
diff --git a/crates/ledger/src/settle.rs b/crates/ledger/src/settle.rs
