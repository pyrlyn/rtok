# Everything here is invented: crate, path, id, host and number names belong to the fictional
# `acme` project, nothing is copied from a real session. Each [[body]] is the full text of one
# tool result; `keep` lists the spans (verbatim substrings) whose loss would send the agent
# back to `expand`: file:line locations, identifiers, error lines, numbers, commands, ids.
