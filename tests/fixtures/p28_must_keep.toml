# The spans sit mostly in the middle of each body on purpose: the shipped `archive` pointer
# shows only the first `head_lines` (8) and last `tail_lines` (4) lines, so a compressor that
# merely matches the pointer view fails this set. `tests/p28_must_keep.rs` checks the
# fixture itself (spans present, middle spans exist) and records what the pointer view keeps.

