# T8.8 ground truth for the `graph` index (2026-09-04).
#
# Hand-picked from this repo and labelled from a plain-text scan (`fn|struct|enum|trait` for
# definitions, identifier-with-`(`/`::`/`{` for references, comment lines dropped), never from
# the tags index this file scores -- an index measured against its own edges is an upper bound,
# not a number (code-review-graph"s own README makes that mistake).
#
# `defs` is complete: every file in this repo that defines the name, so precision is computable.
# `refs` is a must-appear subset, so it stays valid as the repo changes. No line numbers, for
# the same reason. Names that collide with std or third-party methods (`metadata`, `line`,
# `merge`, `extract`) are deliberately excluded: a hit there would not prove anything.
#
# T8.19 repair (2026-09-09), recorded here rather than done quietly: T23.5 added
# `MemoryHost` (`crates/rtok-plugin-sdk/src/testing.rs`), which implements every capability
# trait, so six fn names below gained a definition the 2026-09-04 scan could not have seen --
# that, not an index regression, was the precision 0.864 failure. T26.1 removed both
# `str_field` call sites, so that symbol's `refs` is now empty.
#
# T15.11 (2026-09-09): `measure::stats::plugin_json` moved into the model
# (`model::plugin_stats`); the `plugin_json` entry named a symbol the tree no
# longer has, so it is removed rather than left to miss. T27.0 (2026-09-09):
# `read_settings` became the SDK's `read_json` -- its entry is gone for the
# same reason (def and all three call sites).
#
# T34.6 (2026-09-10): `wire::find_usage` took over every `int_field` call, so the three wire
# files no longer name it and its `refs` is `wire.rs` alone. The three stale labels read as a
# ref-recall drop 0.318 -> 0.290 with the index unchanged;
# `every_label_names_a_file_that_mentions_the_symbol` now names such a label instead. Its
# first run also found `Registry` and `Replay` labelled in `src/cli.rs`, which T15.11 had
# emptied of both (the calls moved to `src/web/model.rs`, where they are now labelled).
#
# T66.1 (2026-09-18): `mem_save` became an upsert, so `src/plugins/memory/mod.rs` calls
# `upsert_note` and no longer names `insert_note`. The call site did not disappear, it was
# renamed: `insert_note` loses that one ref (`import.rs` and `checkpoint.rs` still call it)
# and `upsert_note` enters with the same def/ref pair, so the sample keeps its size.
#
# T209 (2026-09-24): `notes_topic` (migration 0020) enforces "one row per (project, kind,
# title)" at the database level, so `checkpoint.rs`'s repeat-PreCompact write moved from
# `insert_note` to `upsert_note` the same way T66.1 moved `mem_save`. `insert_note` loses
# the `checkpoint.rs` ref (`import.rs` still calls it) and `upsert_note` gains it.
#
# T392 (2026-10-07): the guard plugin overrides `Plugin::session_start` to forget its skill-load
# marks after a compaction, so `src/plugins/guard/mod.rs` joined the `session_start` defs -- a
# definition the scan could not have seen, not an index regression.
#
# T433 (2026-10-08): the hook dispatcher saves its stdin through `insert_hook_call_io`, which
# splits off the session fields and falls back to `insert_call_io` from
# `src/store/hook_fields.rs`; that file takes over the `src/hooks/mod.rs` ref.

