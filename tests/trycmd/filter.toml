bin.name = "rtok"
args = "filter --cmd \"git status\""
stdin = """
On branch main
Changes not staged for commit:
  (use "git add <file>..." to update what will be committed)
  (use "git restore <file>..." to discard changes in working directory)
	modified:   src/lib.rs
	modified:   src/main.rs
	modified:   src/plugins/cmd/run.rs

Untracked files:
  (use "git add <file>..." to include in what will be committed)
	notes.txt

no changes added to commit (use "git add" and/or "git commit -a")
"""
stdout = """
On branch main
 M src/lib.rs
 M src/main.rs
 M src/plugins/cmd/run.rs
?? notes.txt
[rtok 59cc4b713b9a · 13 lines]
"""

# Hermetic by construction: isolated HOME/RTOK_HOME, inherit = false.
[env]
inherit = false

[env.add]
HOME = "target/tmp/t60-2-filter"
RTOK_HOME = "target/tmp/t60-2-filter"
SHELL = "/bin/sh"
