bin.name = "rtok"
args = "--config tests/trycmd/input/usage-logs.toml agents usage --tz Europe/Kyiv"
stdout = """
rtok agents usage: logs from 6 agents, up to 2026-10-02 (Europe/Kyiv)

  6.85M tokens
  $7.70 estimated cost
  6 sessions
  7 daily rows

! Cost is incomplete: 3 models have no price in [stats.prices], so their tokens are not in
  the estimate. `rtok agents usage --unpriced` lists them.

Agent       Tokens Estimated cost
Codex         3.2M          $6.00
Claude Code  3.65M          $1.70
Copilot CLI  1.08K          $0.00
Gemini CLI     550          $0.00
pi           1.48K          $0.00
Kimi Code      865              -

Monthly totals
Month   Tokens Estimated cost
2026-10  6.85M          $7.70
"""

# The logs are fixture files; HOME and RTOK_HOME are isolated and the env is cleared.
stderr = """
skipped grok: unsupported: xAI documents `grok usage`, not the session files in [..]
"""

[env]
inherit = false

[env.add]
HOME = "target/tmp/t358-2-agents-usage-logs"
RTOK_HOME = "target/tmp/t358-2-agents-usage-logs"
