bin.name = "rtok"
args = "graph projects link 9999"
status.code = 1
stderr = """
Error: no selected project; pass --from <project> or `rtok graph projects select`
"""

# Hermetic by construction: isolated HOME/RTOK_HOME, inherit = false.
[env]
inherit = false

[env.add]
HOME = "target/tmp/t3292-projects"
RTOK_HOME = "target/tmp/t3292-projects"
