# Toolchain for rtok-kotlin, installed with `mise install` (see docs/toolchain.md).
# Kotlin libraries and klibs stay in Gradle (Maven Central); the build system is Gradle.
# Keep `gradle` in step with gradle/wrapper/gradle-wrapper.properties.
[tools]
java = "temurin-25.0.5+8.0.LTS"   # JDK for Gradle and the Kotlin daemon
kotlin = "2.4.21"                 # CLI compiler for .main.kts CI scripts; matches the Gradle plugin
gradle = "9.8.2"                  # same as the wrapper
rust = "1.99.1"                   # builds the Rust wasm demo guest (wasm32-unknown-unknown) used by WASM plugin tests
cmake = "4.4.4"                   # native C builds (tree-sitter grammars, zstd)
ninja = "1.13.2"
tree-sitter = "0.27.1"            # tree-sitter CLI: regenerates grammar parser.c where needed

# Smart runs (scripts/smart.py): FULL or AFFECTED, decided from the git diff; see AGENTS.md.
[tasks.test-smart]
description = "Tests: full run when shared build config or many modules changed, else affected modules only"
run = "python3 scripts/smart.py test"
[tasks.build-smart]
description = "Build: full or affected, same rule as test-smart"
run = "python3 scripts/smart.py build"
[tasks.test-affected]
description = "Tests of changed modules and their dependents only"
run = "python3 scripts/smart.py test --affected"
[tasks.build-affected]
description = "Assemble changed modules and their dependents only"
run = "python3 scripts/smart.py build --affected"

# Dev-only coverage (scripts/coverage.py, docs/toolchain.md). Never used by product or release builds.
[tasks.coverage]
description = "Line coverage: Kover (JVM build of common-only modules) + llvm-cov for the vendored tree-sitter C"
run = "python3 scripts/coverage.py --c"

# Release link of the rtok binary (docs/toolchain.md). `release` = shipped build, full optimization, no cache.
[tasks.release]
description = "Release binary, full whole-program optimization (default, for shipping)"
run = "./gradlew :rtok:linkReleaseExecutableMacosArm64"
[tasks.release-fast]
description = "Release binary from cached per-library .a (no whole-program optimization); dev/CI only, never ship"
run = "./gradlew :rtok:linkReleaseExecutableMacosArm64 -Prtok.release.fast=true"

# Size budget (docs/binary-size.md): links the shipped release and fails when it is over the budget in scripts/size_check.py.
[tasks.size-check]
description = "Link the release binary and fail when it exceeds the size budget"
run = "python3 scripts/size_check.py"
