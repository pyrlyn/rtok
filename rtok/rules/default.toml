# Fallback filters when no family formatter matches (plan T3.3). Never redact.

[grep]
max_lines = 40
head = 10
tail = 10
drop = ["Binary file"]
keep = ["error|warning"]
dedupe = true


[rg]
max_lines = 40
head = 10
tail = 10
drop = ["Binary file"]
keep = ["error|warning"]
dedupe = true
group = "dir"


[sed]
max_lines = 40
head = 10
tail = 10
drop = []
keep = ["error"]
dedupe = true

[cat]
max_lines = 80
head = 20
tail = 20
drop = []
keep = []
dedupe = false

[make]
max_lines = 40
head = 8
tail = 16
drop = []
keep = ["error|Error|***"]
dedupe = true

[curl]
max_lines = 40
head = 10
tail = 10
drop = []
keep = ["error|HTTP|curl:"]
dedupe = true

[npm]
max_lines = 40
head = 8
tail = 16
drop = []
keep = ["error|ERR!|npm ERR"]
dedupe = true

[pnpm]
max_lines = 40
head = 8
tail = 16
drop = []
keep = ["error|ERR_PNPM"]
dedupe = true

[node]
max_lines = 40
head = 8
tail = 16
drop = []
keep = ["Error|error"]
dedupe = true

[gh]
max_lines = 40
head = 8
tail = 16
keep = ["error|Error|fatal|HTTP 4|gh:"]
dedupe = true

[pip]
max_lines = 40
head = 8
tail = 16
keep = ["error|ERROR|Could not|No matching|Requirement"]
dedupe = true

[uv]
max_lines = 40
head = 8
tail = 16
keep = ["error|ERROR|Failed|Could not"]
dedupe = true

[python]
max_lines = 40
head = 5
tail = 15
keep = ["Traceback|Error|SyntaxError|IndentationError|ModuleNotFoundError"]
dedupe = true

[python3]
max_lines = 40
head = 5
tail = 15
keep = ["Traceback|Error|SyntaxError|IndentationError|ModuleNotFoundError"]
dedupe = true

[go]
max_lines = 40
head = 8
tail = 16
keep = ["error|Error|panic|fatal|FAIL|cannot|undefined"]
dedupe = true

[aws]
max_lines = 40
head = 8
tail = 16
keep = ["error|Error|An error occurred|AccessDenied|NotFound|Exception"]
dedupe = true

[mvn]
max_lines = 40
head = 8
tail = 20
keep = ["BUILD FAILURE|ERROR|FAILURE|\\[ERROR\\]"]
dedupe = true

[gradle]
max_lines = 40
head = 8
tail = 20
keep = ["BUILD FAILED|FAILURE|error:|Error|What went wrong"]
dedupe = true

[dotnet]
max_lines = 40
head = 8
tail = 16
keep = ["error CS|error MSB|error NU|Build FAILED"]
dedupe = true
group = "diag"


[tsc]
max_lines = 40
head = 8
tail = 16
keep = ["error TS|Found \\d+ error"]
dedupe = true
group = "diag"


[eslint]
max_lines = 40
head = 8
tail = 16
keep = ["error|warning|✖|problems"]
dedupe = true
group = "diag"


[brew]
max_lines = 40
head = 8
tail = 16
keep = ["Error:|error:|failed|Warning:"]
dedupe = true

[apt]
max_lines = 40
head = 8
tail = 16
keep = ["^E:|error|failed|Unable to"]
dedupe = true

[cmake]
max_lines = 40
head = 8
tail = 16
keep = ["CMake Error|error:|FAILED|Error"]
dedupe = true

[ls]
max_lines = 40
head = 10
tail = 10
group = "dir"
dedupe = true

[find]
max_lines = 40
head = 10
tail = 10
group = "dir"
dedupe = true

[cargo]
max_lines = 40
head = 8
tail = 16
keep = ["error[|error:|warning:"]
group = "diag"
dedupe = true

# T662: one `path:line:col: CODE msg` family (ruff, mypy, rubocop, golangci-lint) folds to
# `CODE ×N: msg (locations…)`, repeating the message once and naming the first locations (the rest is in `expand`).
[ruff]
max_lines = 40
head = 8
tail = 16
keep = ["Found \\d+ error|All checks passed"]
group = "diag"
dedupe = true

[mypy]
max_lines = 40
head = 8
tail = 16
keep = ["Found \\d+ error|Success"]
group = "diag"
dedupe = true

[rubocop]
max_lines = 40
head = 8
tail = 16
keep = ["offenses? detected"]
group = "diag"
dedupe = true

[golangci-lint]
max_lines = 40
head = 8
tail = 16
group = "diag"
dedupe = true

# T386: path-shaped awk output folds like `ls`. Do not tighten this past a golden that loses to `Rule::default()`.
[awk]
max_lines = 24
head = 4
tail = 4
collapse_columns = true
group = "dir"
keep = ["awk:|fatal"]
dedupe = true

# T177: a single Bash call chaining 2+ DISTINCT programs (`&&`, `;`, or a newline) —
# matched by `formatters::compress`'s mixed-chain detection, not by a command name. A
# same-program chain (`cargo build && cargo test`) keeps using that program's own
# formatter/rule instead; only a genuine mix rarely fits one family's `keep` patterns,
# so this stays generic.
[script]
max_lines = 30
head = 10
tail = 10
keep = ["error|Error|fail|FAIL|panic|Exception|warning|Warning"]
dedupe = true
