# Build speed (see docs/build-speed.md)
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.daemon=true
kotlin.daemon.jvmargs=-Xmx4g
kotlin.incremental.native=true
kotlin.native.ignoreDisabledTargets=true
# Set to true (or -Prtok.allTargets=true) to add linuxX64/linuxArm64/mingwX64
rtok.allTargets=false
# Remote build cache (R2) total-size cap, enforced by the infra pruning job, not by Gradle.
# Single source of truth for docs/build-speed.md "Remote build cache".
rtok.remoteCache.maxTotalSize=10GB
