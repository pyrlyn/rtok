# Build speed (see docs/build-speed.md)
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.daemon=true
kotlin.daemon.jvmargs=-Xmx4g
kotlin.incremental.native=true
kotlin.native.ignoreDisabledTargets=true
# Set to true (or -Prtok.allTargets=true) to add linuxX64/linuxArm64/mingwX64
rtok.allTargets=false
# Remote build cache (R2) total-size cap, enforced by the infra pruning job, not by Gradle.
# Single source of truth for docs/build-speed.md "Remote build cache".
rtok.remoteCache.maxTotalSize=10GB
# Fast release (opt-in): `-Prtok.release.fast=true` turns on the K/N release binary cache in build.gradle.kts
# (docs/toolchain.md, docs/experiments/binary-split.md). Default releases keep full whole-program optimization.
rtok.release.fast=false
# WASM plugins (opt-in): `-Prtok.wasm=true` builds :rtok-wasm and links the Chasm engine into :rtok (docs/wasm-plugins.md).
rtok.wasm=false
# Dev-only coverage modules (sources all common, JVM-buildable), used by shared.settings.kmp with -Prtok.coverage=true.
rtok.coverage.modules=humantime,toml,toml-ktoml,http,wasm,wasm-chasm,rtok-plugin-sdk,treesitter

# Release binary size (docs/build-speed.md "Release binary size"): all of small, strip, latin1 (shared.settings.native).
diffuser.releaseSize=all
