[package]
name = "rtok-plugin-sdk"
version = "0.0.1"
edition = "2024"
rust-version = "1.98.1" # the pin in mise.toml; a plugin author needs no newer toolchain
readme = "README.md"
repository = "https://github.com/pyrlyn/rtok"
homepage = "https://pyrlyn.github.io/landing/rtok/"
description = "The rtok plugin contract: the trait, its events, and the values a plugin returns"
# Apache-2.0, chosen by the repository owner for this crate (T23.6). The full text ships in
# the package: `cargo publish` takes what is inside this directory and nothing above it.
license = "Apache-2.0"
# crates.io publish paused for now; flip to true (and release-plz) when ready again.
publish = false
categories = ["development-tools"]
keywords = ["rtok", "plugin", "tokens", "llm", "agents"]

[dependencies]
# Three, none of them C (T23.0). Anything heavier belongs on the host side of the line.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# anyhow: the capability traits return `Result` and a plugin author already has it in tree
anyhow = "1.0.104"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
