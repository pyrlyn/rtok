[package]
name = "rtok-sys"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false
description = "OS shims that need unsafe on Windows (process + flock)"
license = "MIT"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process", "fs"] }

# `proc_pidinfo` reads another process's parent pid on macOS; rustix has only the caller's own.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_IO",
  "Win32_System_Threading",
] }

# Windows process and LockFileEx have no safe std equivalent. Cargo cannot
# override one inherited lint, so `src/lib.rs` allows `unsafe_code`.
[lints]
workspace = true
