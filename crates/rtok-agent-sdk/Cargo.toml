[package]
name = "rtok-agent-sdk"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true # a host-integration author needs no newer toolchain than mise.toml
readme = "README.md"
repository.workspace = true
description = "The rtok agent-host contract: reversible, idempotent installs for `rtok agent setup <host>`"
license = "Apache-2.0"
categories = ["development-tools"]
keywords = ["rtok", "agents", "install", "mcp", "hooks"]

[dependencies]
# Same two-dependency line the plugin SDK holds; the installer's prompt is one plain
# stdout line + stdin read (T81), so no prompt crate is needed.
serde_json = { workspace = true }
anyhow = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
rstest = { workspace = true }
