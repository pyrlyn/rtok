# cargo-fuzz (libFuzzer) targets for rtok; see README.md. Its own workspace, excluded from
# the root one, so `cargo build`/`cargo test` and CI never compile it. Nightly only:
# `cargo +nightly fuzz run <target>`.
[package]
name = "rtok-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "GPL-3.0-or-later"

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

[dependencies]
arbitrary = { version = "1.4", features = ["derive"] } # structured argv / inputs
clap = "4.5" # `CommandFactory` / `Parser` for `rtok::cli::Cli`, same major as rtok
libfuzzer-sys = "0.4"
rtok = { path = ".." }
serde_json = "1.0.151"

[profile.release]
debug = 1


[[bin]]
name = "cli-argv"
path = "fuzz_targets/cli-argv.rs"
test = false
doc = false
bench = false

[[bin]]
name = "config-toml"
path = "fuzz_targets/config-toml.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cmd-filter"
path = "fuzz_targets/cmd-filter.rs"
test = false
doc = false
bench = false

[[bin]]
name = "jsonc-edit"
path = "fuzz_targets/jsonc-edit.rs"
test = false
doc = false
bench = false

[[bin]]
name = "hook-io"
path = "fuzz_targets/hook-io.rs"
test = false
doc = false
bench = false

[[bin]]
name = "proxy-wire"
path = "fuzz_targets/proxy-wire.rs"
test = false
doc = false
bench = false

[[bin]]
name = "transcript-jsonl"
path = "fuzz_targets/transcript-jsonl.rs"
test = false
doc = false
bench = false

[[bin]]
name = "text-ops"
path = "fuzz_targets/text-ops.rs"
test = false
doc = false
bench = false

[[bin]]
name = "outline"
path = "fuzz_targets/outline.rs"
test = false
doc = false
bench = false
