# rtok as a ketch package.
#
# Inference from github:pyrlyn/rtok already works; this file is what
# `ketch push` sends to the registry and what docs / `ketch info` show.
# Schema: pyrlyn/ketch docs/MANIFESTS.md.

name = "rtok"
source = "github:pyrlyn/rtok"
description = "Reduce the context AI coding agents must carry"
homepage = "https://github.com/pyrlyn/rtok"

# Only the CLI and its fast hook client. The release archives also ship
# `plugins/` for `rtok agents install`; without an explicit `bin`, Windows
# auto-discovery treats `plugins/cursor/scripts/mcp.cmd` (and `mcp.sh`) as
# installable binaries and copies them into `~/.ketch/bin`, which then breaks
# upgrades. Keep this pin.
#
# Two entries, because host hook commands try `rtok-hook` before `rtok hook`
# (T349); without a link for it every hook pays the full `rtok` start. A glob
# that matches several payload files links the candidate whose stem equals
# `name` (ketch docs/MANIFESTS.md), so `rtok*` links `rtok`, never `rtok-hook`
# (a Windows install once linked the hook stub as `rtok`, 2026-09-26).
bin = [
  { path = "rtok*", name = "rtok" },
  { path = "rtok-hook*", name = "rtok-hook" },
]

# Prefer platform archives dist publishes; skip self-updater sidecars and
# the source tarball so scoring cannot pick those by mistake.
[asset]
include = [
  "*-apple-darwin.tar.xz",
  "*-linux-gnu.tar.xz",
  "*-pc-windows-msvc.zip",
]
exclude = ["*-update*", "source.tar.gz"]
