# jactionlint configuration: https://github.com/jdx/jactionlint/blob/main/docs/config.md
# The default profile applies. `baseline: auto` hides the findings recorded in
# .github/jactionlint-baseline.json; refresh it with `mise x -- jactionlint --baseline-write`.
baseline: auto

# release.yml is generated by cargo-dist ("autogenerated by dist"): report nothing there, as
# pyrlyn/ci's lint.yml skips it (`ignore-generated`). Fix the generator, not the file.
generated-files: skip
