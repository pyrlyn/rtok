name: agent-tests-nightly

# Agent tests (./gradlew agentTest, docs/testing.md "Agent tests") once a night; not run on PRs or pushes.
# Note: the build includes ci-diffuser, kotlin-snapshot and kotlin-webgl, which are local-only (no GitHub
# remote yet), so this job cannot build until they are published; kotlin-wasm is checked out from pyrlyn.
on:
  schedule:
    # 03:00 UTC = 05:00 Kyiv in winter (UTC+2). GitHub cron is UTC-only, so in summer (UTC+3) this runs at 06:00 Kyiv.
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-tests-nightly
  cancel-in-progress: false

jobs:
  # Which runner the macOS job uses: pyrlyn/ci's macos-runner action reads the MACOS_RUNNER
  # variable (unset or `hosted` = the hosted label, `xcode-27-local` = the dedicated Mac).
  macos-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      value: ${{ steps.r.outputs.value }}
    steps:
      - id: r
        uses: pyrlyn/ci/.github/actions/macos-runner@9675ff42a0e3785beabccb68b0e4fa65910de453 # main
        with:
          runner: ${{ vars.MACOS_RUNNER }}
          value: '["macos-26"]'

  agent-tests:
    needs: macos-runner
    runs-on: ${{ fromJSON(needs.macos-runner.outputs.value) }}
    timeout-minutes: 60
    env:
      KOTLIN_WASM_DIR: ${{ github.workspace }}/kotlin-wasm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pyrlyn/kotlin-wasm
          path: kotlin-wasm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Run agent tests
        run: ./gradlew agentTest
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-test-reports
          path: |
            rtok/build/reports/tests/agentTest/
            rtok/build/test-results/agentTest/
          if-no-files-found: ignore
          retention-days: 14
