    strategy:
      fail-fast: true
      matrix:
        include:
        - os: 'macos-15'
          target: 'macosArm64'
          task: ':rtok:linkReleaseExecutableMacosArm64'
          gradle-flags: ''
        - os: 'ubuntu-latest'
          target: 'linuxX64'
          task: ':rtok:linkReleaseExecutableLinuxX64'
          gradle-flags: '-Prtok.allTargets=true -x ktlintCheck -x detekt'
          prepare: 'KOTLIN_VERSION=$(mise current kotlin) ./gradlew -p scripts/ci/konan-bootstrap linkDebugExecutableLinuxX64 linkDebugExecutableLinuxArm64 --console=plain'
    defaults:
      run:
        shell: 'bash'
    steps:
    - id: 'step-0'
      uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
      with:
        persist-credentials: 'false'
    - id: 'step-1'
      uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
      with:
        repository: 'pyrlyn/packages'
        ref: '0.0.1'
        path: 'packages'
        persist-credentials: 'false'
    - id: 'step-2'
      uses: 'actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333'
      with:
        name: 'bump'
        path: '.'
    - id: 'step-3'
      uses: 'jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d'
    - id: 'step-4'
      uses: 'gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c'
      with:
        cache-read-only: 'true'
    - id: 'step-5'
      uses: 'actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9'
      with:
        path: '~/.konan'
        key: 'konan-${{ runner.os }}-${{ hashFiles(''mise.toml'', ''scripts/ci/konan-bootstrap/**'') }}'
        restore-keys: 'konan-${{ runner.os }}-'
    - id: 'step-6'
      name: 'Prepare the Kotlin/Native toolchain'
      run: '${{ matrix.prepare }}'
      if: 'matrix.prepare'
    - id: 'step-7'
      name: 'Build'
      run: './gradlew ${{ matrix.gradle-flags }} ${{ matrix.task }} --console=plain'
    - id: 'step-8'
      name: 'Smoke test'
      run: |
        set -euo pipefail
        bin="rtok/build/bin/$TARGET/releaseExecutable/rtok.kexe"
        out="$("$bin" --version)"
        echo "$out"
        grep -qF "${TAG#v}" <<<"$out" || { echo "::error::$bin --version does not report ${TAG#v}"; exit 1; }
    - id: 'step-9'
      name: 'Package'
      run: |
        set -euo pipefail
        name="rtok-$TAG-$TARGET"
        stage="$RUNNER_TEMP/stage/$name"; mkdir -p "$stage" "$RUNNER_TEMP/dist"
        cp "rtok/build/bin/$TARGET/releaseExecutable/rtok.kexe" "$stage/rtok"
        cp README.md CHANGELOG.md "$stage/"
        tar -C "$RUNNER_TEMP/stage" -czf "$RUNNER_TEMP/dist/$name.tar.gz" "$name"
        cd "$RUNNER_TEMP/dist"
        if command -v sha256sum >/dev/null; then sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
        else shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"; fi
        cat "$name.tar.gz.sha256"
        echo "DIST_DIR=$RUNNER_TEMP/dist" >> "$GITHUB_ENV"
