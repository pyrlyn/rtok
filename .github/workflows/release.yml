    - 'checks'
    timeout-minutes: 120
    strategy:
      fail-fast: true
      matrix:
        include:
        - os: 'macos-15'
          command: './gradlew macosArm64Test cliTest e2eTest --console=plain'
        - os: 'ubuntu-latest'
          prepare: 'KOTLIN_VERSION=$(mise current kotlin) ./gradlew -p scripts/ci/konan-bootstrap linkDebugExecutableLinuxX64 linkDebugExecutableLinuxArm64 --console=plain'
          command: './gradlew -Prtok.allTargets=true linuxX64Test cliTest e2eTest -x ktlintCheck -x detekt --continue --console=plain'
