      run:
        shell: 'bash'
    steps:
    - id: 'step-0'
      uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
      with:
        persist-credentials: 'false'
    - id: 'step-1'
      uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
      with:
        repository: 'pyrlyn/packages'
        ref: '0.0.1'
        path: 'packages'
        persist-credentials: 'false'
    - id: 'step-2'
      uses: 'actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333'
