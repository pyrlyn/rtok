name: 'release'
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Part of the version to bump for the next prerelease cycle.'
        type: 'choice'
        required: false
        default: 'minor'
        options:
        - 'major'
        - 'minor'
        - 'patch'
      pre-id:
        description: 'Prerelease identifier (X.Y.Z-<pre-id>.N).'
        type: 'string'
        required: false
        default: 'alpha'
      dry-run:
        description: 'Run checks, verify and build only; never tag or create a release.'
        type: 'boolean'
        required: false
        default: 'true'
permissions:
