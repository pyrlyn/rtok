        mkdir -p "$RUNNER_TEMP/bump/$(dirname "$VERSION_FILE")"
        cp CHANGELOG.md "$RUNNER_TEMP/bump/"
        cp "$VERSION_FILE" "$RUNNER_TEMP/bump/$VERSION_FILE"
