# Gated pipeline. Local ci.yml and pyrlyn/ci's config-driven ci.yml (CodeQL, Semgrep, Snyk,
# SonarCloud on main, actionlint; configured in .github/infra.yml, Rust CI stays local) run in
# parallel; `gate` passes only when both succeeded.
# Anything downstream (deploy, release, publish) must `needs: gate`. Draft pull requests skip
# every job, the gate included, until marked ready. Secrets are passed explicitly.
# Docs-only pull requests (`docs-only` in .github/infra.yml): `changes` tells ci.yml to run
# only its `docs` job, infra's ci.yml skips its scans, and `gate` still reports success.
# Shared workflows: https://github.com/pyrlyn/ci/blob/main/docs/reusable-workflows.md
name: pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # infra's config action on .github/infra.yml: `docs-only` is "true" when docs-only applies to
  # this event and every changed file is documentation (fails open: "false" when unsure).
  changes:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs-only: ${{ steps.config.outputs.docs-only }}
    steps:
      - id: config
        uses: pyrlyn/ci/.github/actions/config@4e652d891cc6e6f0be316eda1a1f9630d76a8b7e # main

  ci:
    needs: changes
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    uses: ./.github/workflows/ci.yml
    with:
      docs-only: ${{ needs.changes.outputs.docs-only == 'true' }}
    # ci.yml's jobs request these (e.g. revert-on-failure); a called workflow cannot exceed them.
    permissions:
      contents: write
      pull-requests: write
      actions: write # ci.yml cancels the run on the first failed step

  pipeline:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    uses: pyrlyn/ci/.github/workflows/ci.yml@4e652d891cc6e6f0be316eda1a1f9630d76a8b7e # main
    # The union every nested job asks for, validated up front even for disabled checks.
    permissions:
      contents: read
      security-events: write
      pull-requests: read
      actions: write
    secrets:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  gate:
    needs: [changes, ci, pipeline]
    # always(): ci.yml cancels the run on its first failure, and a skipped gate would read as
    # passing, so the gate still runs and reports the failed or cancelled need.
    # Skipped on draft PRs like every other job, so a draft never leaves a green `gate` behind.
    # On a docs-only PR the skipped jobs live inside `ci` and `pipeline`, which still succeed.
    if: >-
      always()
      && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    steps:
      - uses: pyrlyn/ci/.github/actions/gate@4e652d891cc6e6f0be316eda1a1f9630d76a8b7e # main
        with:
          needs: ${{ toJSON(needs) }}
