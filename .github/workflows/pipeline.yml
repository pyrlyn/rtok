# Gated pipeline. Local ci.yml and pyrlyn/ci's config-driven ci.yml (CodeQL, Semgrep, Snyk,
# SonarCloud on main, actionlint; configured in .github/infra.yml, Rust CI stays local) run in
# parallel. The only gate is `pipeline / gate`, pyrlyn/ci's own gate job inside the `pipeline`
# job below; it is the protect-main required check. Draft pull requests skip every job until
# marked ready. Secrets are passed explicitly.
# Docs-only pull requests (`docs-only` in .github/infra.yml): `changes` tells ci.yml to run
# only its `docs` job, infra's ci.yml skips its scans, and `pipeline / gate` still reports success.
# Shared workflows: https://github.com/pyrlyn/ci/blob/main/docs/reusable-workflows.md
name: pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # infra's config action on .github/infra.yml: `docs-only` is "true" when docs-only applies to
  # this event and every changed file is documentation (fails open: "false" when unsure).
  changes:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs-only: ${{ steps.config.outputs.docs-only }}
    steps:
      - id: config
        uses: pyrlyn/ci/.github/actions/config@main

  ci:
    needs: changes
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    uses: ./.github/workflows/ci.yml
    with:
      docs-only: ${{ needs.changes.outputs.docs-only == 'true' }}
    # ci.yml's jobs request these; a called workflow cannot exceed them.
    permissions:
      contents: read
      actions: write # ci.yml cancels the run on the first failed step

  pipeline:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    uses: pyrlyn/ci/.github/workflows/ci.yml@main
    # The union every nested job asks for, validated up front even for disabled checks.
    permissions:
      contents: read
      security-events: write
      pull-requests: read
      actions: write
      issues: write # pyrlyn/ci main-failure job (pyrlyn/ci#56)
    secrets:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
