name: repo-settings

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: repo-settings-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repo-settings:
    uses: pyrlyn/ci/.github/workflows/repo-settings.yml@main
    secrets:
      REPO_ADMIN_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
