# Dependency updates as pull requests (T18.7). Each one runs the full CI (pipeline.yml);
# .github/workflows/dependabot.yml merges a patch update once that run is green and labels
# minor and major updates `needs-review` for a human. Commit prefixes land in
# cliff.toml's Tooling group.
#
# Patch and minor updates are grouped separately so a patch-only pull request can be merged
# on its own; a major update always arrives alone.
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    # A release waits a week before a pull request opens, so a yanked or broken version is
    # usually caught upstream first.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      # The parser and every grammar share one ABI, and a grammar bump changes the tags its
      # query sees, so they move together (a stored index keeps the old rows until T35.5).
      tree-sitter:
        patterns: ["tree-sitter*"]
      # Everything else short of a major bump: at most two pull requests a week, not one per
      # crate. Dependabot ranks a group without patterns as the more specific one, so
      # tree-sitter is excluded here or it never reaches its own group (first run, 2026-09-11).
      patch:
        exclude-patterns: ["tree-sitter*"]
        update-types: [patch]
      minor:
        exclude-patterns: ["tree-sitter*"]
        update-types: [minor]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    # release.yml is written by tools/dist-generate.sh (`dist generate` plus a patch); an edit
    # here is lost on the next generate. Its actions move when dist is upgraded.
    exclude-paths:
      - .github/workflows/release.yml
    groups:
      actions-patch:
        update-types: [patch]
      actions:
        update-types: [minor, major]

  # The Hugo site's modules (site/go.mod).
  - package-ecosystem: gomod
    directory: /site
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      site-patch:
        update-types: [patch]
      site-minor:
        update-types: [minor]
