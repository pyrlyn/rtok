# Injected into cargo-dist's build-local-artifacts job (see dist-workspace.toml
# github-build-setup). Kept one level above .github/workflows so GitHub does not
# treat it as a standalone workflow.
#
# Restore Cargo registry/git/target between releases. Upload always — release
# runners are few, and a warm cache cuts the multi-minute `dist build` on each
# target. Keyed per runner OS + job name so macOS and Linux do not collide.
#
# dist signs with CODESIGN_IDENTITY + CODESIGN_CERTIFICATE(+_PASSWORD). This
# repo stores the cert as MACOS_CERTIFICATE / MACOS_CERTIFICATE_PWD (same as
# ketch); just dist-generate maps those names into release.yml. Identity is not
# a secret here — we import the cert into a throwaway keychain and read the
# Developer ID Application identity out of it, matching ketch's release.yml.

# Build releases with the Rust that ci.yml tests: the `rust` pin in mise.toml (the
# single source of the Rust version), not whatever stable the runner image ships.
# Runs first so rust-cache keys on this rustc. Only `rust` is installed; the other
# mise tools are not needed to build, except `node` for the SPA. rustfmt and clippy come from mise.toml.
- name: Install Rust from mise.toml
  uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
  with:
    install_args: rust node
    cache_key_prefix: mise-v1-release

# Make the mise pin the active toolchain for every later rustup/cargo call (dist)
# and add the matrix cross targets to it.
- name: Add release targets to the mise toolchain
  shell: bash
  env:
    TARGETS: ${{ join(matrix.targets, ' ') }}
  run: |
    set -euo pipefail
    version="$(mise current rust)"
    echo "RUSTUP_TOOLCHAIN=$version" >> "$GITHUB_ENV"
    export RUSTUP_TOOLCHAIN="$version"
    # shellcheck disable=SC2086
    rustup target add $TARGETS
    rustc --version
    rustc --version | grep -q "^rustc $version " \
      || { echo "rustc is not the mise.toml pin $version" >&2; exit 1; }

- name: Cache Cargo build
  uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
  with:
    shared-key: release-dist
    # Release builds are rare; always save so the next cut is warm.
    cache-on-failure: true

# T310.9: the binary embeds the React SPA (build.rs reads web/dist), so an installed `rtok web`
# has a UI even from a ketch install that keeps only the executable. Each matrix job builds the
# SPA before `dist build`; RTOK_WEB_EMBED=require makes build.rs fail rather than embed the
# "UI not built" placeholder.
- name: Build the SPA
  shell: bash
  run: |
    set -euo pipefail
    mise exec -- npm --prefix web ci
    mise exec -- npm --prefix web run build
    echo "RTOK_WEB_EMBED=require" >> "$GITHUB_ENV"

# T319: every archive carries share/ (dist `include`): man pages from `rtok man --dir` and the
# completion scripts. Same profile and target as `dist build`, so that build reuses this compile.
- name: Generate man pages and completions
  shell: bash
  env:
    TARGETS: ${{ join(matrix.targets, ' ') }}
  run: |
    set -euo pipefail
    target="${TARGETS%% *}"
    cargo build --locked --profile dist --target "$target" -p rtok --bin rtok
    bin="target/$target/dist/rtok"
    [ -x "$bin" ] || bin="$bin.exe"
    tools/share-files.sh "$bin" share

- name: Discover macOS codesign identity
  if: runner.os == 'macOS'
  env:
    MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
    MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
  run: |
    set -euo pipefail
    if [ -z "${MACOS_CERTIFICATE:-}" ] || [ -z "${MACOS_CERTIFICATE_PWD:-}" ]; then
      echo "MACOS_CERTIFICATE and MACOS_CERTIFICATE_PWD must both be set:" >&2
      echo "a base64-encoded Developer ID Application .p12 and its password." >&2
      echo "Signing is on (macos-sign = true); an unsigned macOS release is refused." >&2
      exit 1
    fi

    keychain="$RUNNER_TEMP/rtok-codesign-discover.keychain-db"
    keychain_pwd="$(openssl rand -hex 16)"
    cert="$RUNNER_TEMP/rtok-certificate.p12"
    echo "$MACOS_CERTIFICATE" | base64 --decode > "$cert"

    security create-keychain -p "$keychain_pwd" "$keychain"
    security set-keychain-settings -lut 21600 "$keychain"
    security unlock-keychain -p "$keychain_pwd" "$keychain"
    security import "$cert" -P "$MACOS_CERTIFICATE_PWD" \
      -f pkcs12 -k "$keychain" -T /usr/bin/codesign
    rm -f "$cert"
    security set-key-partition-list -S apple-tool:,apple:,codesign: \
      -s -k "$keychain_pwd" "$keychain" >/dev/null

    identity="$(security find-identity -v -p codesigning "$keychain" \
      | sed -nE 's/^ *[0-9]+\) ([0-9A-F]{40}) "Developer ID Application:.*/\1/p')"
    if [ "$(printf '%s\n' "$identity" | grep -c .)" -ne 1 ]; then
      echo "expected exactly one Developer ID Application identity, found:" >&2
      security find-identity -v -p codesigning "$keychain" >&2
      security delete-keychain "$keychain" || true
      exit 1
    fi

    echo "CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
    security delete-keychain "$keychain"
    echo "CODESIGN_IDENTITY discovered (Developer ID Application hash exported for dist)"
