# Configuration for pyrlyn/infra's ci.yml, called from pipeline.yml (docs/config.md in
# pyrlyn/infra). Rust CI stays in the local ci.yml (`just` recipes); this file turns on the
# scans and SonarCloud, which replaces the former sonarcloud.yml.
version: 1

# Docs-only pull requests (pyrlyn/infra docs/config.md, "Docs-only changes"): when every changed
# file is documentation, infra's heavy checks (CodeQL, Semgrep, ...) are skipped and the gate
# counts them as passed. pipeline.yml's `changes` job reads the same verdict and ci.yml then
# runs only its `docs` job (`just docs-check`: plan.md/todo.md ids and Check: lines, the other
# Markdown the tests assert on) instead of lint/check/windows/spa.
# Documentation = any *.md except the paths below: Markdown that is code. src/ (agent and
# plugin READMEs via include_str!), modes/ (include_str!), skills/ (SKILL.md, include_str! and
# shipped), plugins/ (shipped packages; rtok-scout.md via include_str!), crates/ (published
# READMEs), tests/ (trycmd cases), web/, npm/, tools/, fuzz/, assets/, .agents/, README.md
# (`just readme-check`, tests, the crate page) and CHANGELOG.md (release). Anything else
# (.github/, mise.toml, a non-.md file) runs the full CI.
docs-only:
  enabled: true
  exclude:
    - '^(src|modes|skills|plugins|crates|tests|web|npm|tools|fuzz|assets|\.agents)/'
    - '^(README|CHANGELOG)\.md$'

codeql:
  languages: [actions, javascript-typescript, python, rust]

sonarcloud:
  enabled: true
  events: [push, workflow_dispatch] # main-branch analysis only, as before
  rust: true
  mise-install-args: "" # everything in mise.toml (just, cargo-llvm-cov, node, vitest, ...)
  coverage-command: just test-cov
  soft-fail: false

# Snyk is switched off (flag; snyk.yml and SNYK_TOKEN stay): the snyk job is skipped and the
# gate counts it as passed. `enabled: true` turns it back on.
snyk:
  enabled: false

# actionlint stays off for now: dist-generated release.yml (never hand-edited) has shellcheck
# findings. Turn on once .github/actionlint.yaml ignores that file.
lint:
  enabled: false
