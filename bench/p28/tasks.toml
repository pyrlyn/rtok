prompt = "Read logs/01-api.log, logs/02-db.log, logs/03-gateway.log, logs/04-worker.log, logs/05-build.log, logs/06-api.log, logs/07-db.log and logs/08-worker.log in that order, one Read call per file and one file per turn, each in full. Only after all eight, find the path of the config file that logs/02-db.log failed to parse and write just that path to answer.txt."
check = "grep -qF 'deploy/settler/limits.toml' answer.txt; s=$?; rm -f answer.txt; exit $s"

[[tasks]]
id = "request-id"
log = "logs/03-gateway.log"
