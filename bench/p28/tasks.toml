log = "logs/03-gateway.log"
answer = "bat_01HZX4M8Q2"
prompt = "Read logs/01-api.log, logs/02-db.log, logs/03-gateway.log, logs/04-worker.log, logs/05-build.log, logs/06-api.log, logs/07-db.log and logs/08-worker.log in that order, one Read call per file and one file per turn, each in full. Only after all eight, find the id of the batch whose retry budget ran out in logs/03-gateway.log and write just that id to answer.txt."
