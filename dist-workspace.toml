[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app.
# Homebrew builds Formula/rtok.rb as a Release asset only. Do NOT add
# publish-jobs = ["homebrew"]: that job needs HOMEBREW_TAP_TOKEN and pushes
# straight to pyrlyn/homebrew-tap. The tap instead opens a PR via its own
# sync-rtok.yml (GITHUB_TOKEN in the tap repo) — see docs/release.md.
installers = ["shell", "homebrew"]
tap = "pyrlyn/homebrew-tap"
# Target platforms to build apps for (Rust target-triple syntax)
# Apple Silicon + Linux + Windows; macOS is Apple Silicon only.
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Where to host releases
hosting = "github"
# Sign macOS binaries with the Developer ID in MACOS_CERTIFICATE / MACOS_CERTIFICATE_PWD.
# dist expects CODESIGN_*; just dist-generate patches the generated workflow to the MACOS_*
# names this repo already has, and .github/build-setup.yml discovers CODESIGN_IDENTITY.
macos-sign = true
# release.yml is post-patched to MACOS_* secrets; see tools/dist-generate.sh
allow-dirty = ["ci"]
# Injected into build-local-artifacts after checkout; discovers CODESIGN_IDENTITY on macOS.
github-build-setup = "../build-setup.yml"
# Releases start only from the Bump workflow (pyrlyn/infra bump.yml): it merges the version PR,
# tags the landed commit, creates a draft Release and dispatches this workflow with --ref <tag>
# -f tag=<tag>. dist never tags: it uploads to that draft and undrafts it (create-release).
dispatch-releases = true
create-release = false
# T18.1: ship `rtok-update` beside `rtok` so an installed binary can update itself.
install-updater = true
# Build -p rtok only. Default --workspace also compiles rtok-wasm-demo-guest
# (no_std cdylib), which fails on host targets: "unwinding panics are not
# supported without std". Same class of problem as host clippy --all-targets.
precise-builds = true
# T18.6: the test gate is NOT a dist `plan-jobs` entry. dist's `host` job runs on
# `build-local-artifacts.result == 'skipped'`, and a failed custom job skips it — so a red gate
# would publish a Release with no binaries instead of stopping. The gate lives in the two
# required checks of the bump PR, which must pass before bump tags anything.
